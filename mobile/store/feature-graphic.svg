<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="0.55" stop-color="#F4F3EF"/>
      <stop offset="1" stop-color="#E6EDF5"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23425F"/>
      <stop offset="1" stop-color="#102538"/>
    </linearGradient>
    <linearGradient id="cover1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7D74"/>
      <stop offset="1" stop-color="#1C5B55"/>
    </linearGradient>
    <linearGradient id="cover2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#A67F12"/>
    </linearGradient>
    <linearGradient id="cover3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B96A4B"/>
      <stop offset="1" stop-color="#94482E"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F2436" flood-opacity="0.22"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0F2436" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <circle cx="986" cy="26" r="210" fill="#16324F" opacity="0.045"/>
  <circle cx="34" cy="486" r="150" fill="#C9A227" opacity="0.07"/>

  <!-- left column -->
  <rect x="64" y="56" width="196" height="32" rx="16" fill="#16324F" opacity="0.08"/>
  <text x="162" y="77" text-anchor="middle" font-family="DejaVu Sans" font-size="11" font-weight="bold"
        letter-spacing="1.8" fill="#16324F">OPEN SOURCE · FREE</text>

  <text x="60" y="174" font-family="DejaVu Sans" font-size="78" font-weight="bold" fill="#14304C">BiblioJules</text>
  <text x="64" y="214" font-family="DejaVu Sans" font-size="25" fill="#536271">Your personal library catalog</text>
  <line x1="64" y1="240" x2="188" y2="240" stroke="#C9A227" stroke-width="4" stroke-linecap="round"/>

  <!-- feature: scan -->
  <circle cx="79" cy="291" r="16" fill="#16324F" opacity="0.09"/>
  <g fill="#16324F">
    <rect x="70" y="283" width="2" height="16"/>
    <rect x="74" y="283" width="3" height="16"/>
    <rect x="79" y="283" width="1.6" height="16"/>
    <rect x="82.5" y="283" width="2.4" height="16"/>
    <rect x="87" y="283" width="1.6" height="16"/>
  </g>
  <text x="106" y="298" font-family="DejaVu Sans" font-size="20" fill="#26394D">Scan ISBN barcodes</text>

  <!-- feature: local/sync -->
  <circle cx="79" cy="335" r="16" fill="#16324F" opacity="0.09"/>
  <g fill="none" stroke="#16324F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M71.5 337a8.5 8.5 0 0 1 13.6-6.4"/>
    <path d="M85.6 327.6l0.4 4.4-4.3-0.4"/>
    <path d="M86.5 333a8.5 8.5 0 0 1-13.6 6.4"/>
    <path d="M72.4 342.4l-0.4-4.4 4.3 0.4"/>
  </g>
  <text x="106" y="342" font-family="DejaVu Sans" font-size="20" fill="#26394D">Local mode, or sync to your server</text>

  <!-- feature: private -->
  <circle cx="79" cy="379" r="16" fill="#16324F" opacity="0.09"/>
  <g fill="none" stroke="#16324F" stroke-width="2.2" stroke-linecap="round">
    <rect x="71" y="376" width="16" height="11" rx="2.5"/>
    <path d="M74.5 376v-3.2a4.5 4.5 0 0 1 9 0V376"/>
  </g>
  <text x="106" y="386" font-family="DejaVu Sans" font-size="20" fill="#26394D">100% private — no accounts</text>

  <text x="64" y="446" font-family="DejaVu Sans" font-size="15" fill="#6F7E8C">No tracking · No ads · Your data stays yours</text>

  <!-- phone -->
  <rect x="716" y="46" width="230" height="408" rx="30" fill="url(#frame)" filter="url(#shadow)"/>
  <rect x="728" y="58" width="206" height="384" rx="20" fill="#FCFAF5"/>

  <!-- screen: header -->
  <text x="744" y="88" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#16324F">My Library</text>
  <circle cx="914" cy="82" r="9" fill="#E7DFCE"/>
  <circle cx="914" cy="79.5" r="3" fill="#B7AC95"/>
  <path d="M908.5 88a5.5 5.5 0 0 1 11 0z" fill="#B7AC95"/>

  <!-- screen: search -->
  <rect x="744" y="100" width="174" height="26" rx="13" fill="#EFEAE0"/>
  <circle cx="758" cy="113" r="4" fill="none" stroke="#8B8477" stroke-width="1.6"/>
  <line x1="761" y1="116" x2="764" y2="119" stroke="#8B8477" stroke-width="1.6" stroke-linecap="round"/>
  <text x="771" y="117" font-family="DejaVu Sans" font-size="10.5" fill="#8B8477">Search books…</text>

  <!-- screen: cards -->
  <g>
    <rect x="744" y="142" width="40" height="56" rx="5" fill="url(#cover1)"/>
    <rect x="750" y="150" width="28" height="3" rx="1.5" fill="#FFFFFF" opacity="0.55"/>
    <rect x="750" y="157" width="18" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.35"/>
    <rect x="792" y="150" width="108" height="8" rx="4" fill="#D9D2C4"/>
    <rect x="792" y="166" width="70" height="6" rx="3" fill="#E3DDD1"/>
    <rect x="792" y="182" width="46" height="5" rx="2.5" fill="#E3DDD1"/>
  </g>
  <g>
    <rect x="744" y="208" width="40" height="56" rx="5" fill="url(#cover2)"/>
    <rect x="750" y="216" width="26" height="3" rx="1.5" fill="#FFFFFF" opacity="0.55"/>
    <rect x="750" y="223" width="20" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.35"/>
    <rect x="792" y="216" width="96" height="8" rx="4" fill="#D9D2C4"/>
    <rect x="792" y="232" width="82" height="6" rx="3" fill="#E3DDD1"/>
    <rect x="792" y="248" width="54" height="5" rx="2.5" fill="#E3DDD1"/>
  </g>
  <g>
    <rect x="744" y="274" width="40" height="56" rx="5" fill="url(#cover3)"/>
    <rect x="750" y="282" width="30" height="3" rx="1.5" fill="#FFFFFF" opacity="0.55"/>
    <rect x="750" y="289" width="16" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.35"/>
    <rect x="792" y="282" width="104" height="8" rx="4" fill="#D9D2C4"/>
    <rect x="792" y="298" width="64" height="6" rx="3" fill="#E3DDD1"/>
    <rect x="792" y="314" width="40" height="5" rx="2.5" fill="#E3DDD1"/>
  </g>

  <!-- screen: bottom nav -->
  <rect x="744" y="402" width="174" height="28" rx="14" fill="#F1ECE2"/>
  <circle cx="793" cy="416" r="3.4" fill="#16324F"/>
  <circle cx="831" cy="416" r="3.4" fill="#C7BFB0"/>
  <circle cx="869" cy="416" r="3.4" fill="#C7BFB0"/>

  <!-- floating scan card -->
  <g filter="url(#cardShadow)">
    <rect x="596" y="330" width="200" height="68" rx="16" fill="#FFFFFF"/>
    <rect x="596.5" y="330.5" width="199" height="67" rx="15.5" fill="none" stroke="#EDE7DA"/>
  </g>
  <rect x="612" y="346" width="36" height="36" rx="9" fill="#16324F" opacity="0.08"/>
  <g fill="#16324F">
    <rect x="619" y="354" width="2" height="20"/>
    <rect x="623" y="354" width="3" height="20"/>
    <rect x="628" y="354" width="1.6" height="20"/>
    <rect x="631.5" y="354" width="2.6" height="20"/>
    <rect x="636" y="354" width="1.6" height="20"/>
    <rect x="639.5" y="354" width="2.2" height="20"/>
  </g>
  <text x="658" y="362" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" fill="#16324F">Scan any ISBN</text>
  <text x="658" y="379" font-family="DejaVu Sans" font-size="10.5" fill="#7A7364">Add a book in seconds</text>
</svg>
