name: bibliojules_mobile
description: "BiblioJules for Android — a thin client for a hosted BiblioJules library."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cached_network_image: ^4.0.4
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # Copies of the shared string catalogues in ../../app/locales. Keeping the
    # same files means all three clients (web, desktop, mobile) translate
    # identically; `dart test`/`flutter test` has a guard that the copies are in
    # sync (see test/locale_sync_test.dart).
    - assets/locales/
