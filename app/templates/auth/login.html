<!doctype html>
<html lang="{{ current_language }}" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ _('Sign in') }} · {{ app_name }}</title>
  <meta name="description" content="{{ _('A catalog for your home library.') }}">

  <script>
    (function () {
      const stored = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              50: '#eef4ff', 100: '#d9e6ff', 200: '#bcd3ff', 300: '#8eb6ff',
              400: '#598fff', 500: '#3366f2', 600: '#2049db', 700: '#1b3bb0',
              800: '#1c368b', 900: '#1c316e',
            },
          },
        },
      },
    };
  </script>
</head>
<body class="flex min-h-full flex-col bg-slate-100 text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-200">

<div class="flex flex-1 items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm">
    <div class="mb-6 flex flex-col items-center text-center">
      <span class="text-4xl">📚</span>
      <h1 class="mt-2 text-xl font-bold tracking-tight text-slate-900 dark:text-white">{{ app_name }}</h1>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{ _('Sign in to your library') }}</p>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      {% if setup_needed %}
        <div class="mb-4 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-800 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-300">
          <p class="font-semibold">{{ _('No accounts yet') }}</p>
          <p class="mt-1">{{ _('Create the first administrator from a terminal:') }}</p>
          <code class="mt-2 block rounded bg-amber-100 px-2 py-1 font-mono text-xs dark:bg-amber-500/10">python -m app.cli create-admin</code>
        </div>
      {% elif error %}
        <div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-300">
          {{ error }}
        </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-4">
        <input type="hidden" name="_csrf" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next }}">
        <div>
          <label for="username" class="mb-1 block text-xs font-medium text-slate-500 dark:text-slate-400">{{ _('Username') }}</label>
          <input id="username" name="username" value="{{ username }}" autocomplete="username" autofocus
                 class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800 dark:text-white">
        </div>
        <div>
          <label for="password" class="mb-1 block text-xs font-medium text-slate-500 dark:text-slate-400">{{ _('Password') }}</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
                 class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800 dark:text-white">
        </div>
        <button class="w-full rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-brand-700">
          {{ _('Sign in') }}
        </button>
      </form>
    </div>

    <div class="mt-6 flex items-center justify-center gap-4 text-sm">
      <select onchange="location.href='/language?lang=' + encodeURIComponent(this.value) + '&next=' + encodeURIComponent(location.pathname + location.search)"
              aria-label="{{ _('Language') }}"
              class="cursor-pointer rounded-lg border border-slate-200 bg-transparent py-1 text-sm text-slate-500 dark:border-slate-700 dark:text-slate-300">
        {% for code, name in languages.items() %}
          <option value="{{ code }}" {{ 'selected' if code == current_language }}>{{ name }}</option>
        {% endfor %}
      </select>
      <button type="button" onclick="toggleTheme()" class="rounded-lg px-2 py-1 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-800">
        {{ _('Toggle theme') }}
      </button>
    </div>
  </div>
</div>

<script>
  function toggleTheme() {
    const dark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', dark ? 'dark' : 'light');
  }
</script>
</body>
</html>
