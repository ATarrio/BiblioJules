{% extends "base.html" %}
{% block title %}{{ _('Not allowed') }} · {{ app_name }}{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center py-24 text-center">
  <span class="text-6xl">🔒</span>
  <h1 class="mt-4 text-2xl font-bold text-slate-900 dark:text-white">{{ _('Not allowed') }}</h1>
  <p class="mt-2 max-w-md text-sm text-slate-500 dark:text-slate-400">{{ message }}</p>
  <a href="/" class="mt-6 rounded-xl bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-brand-700">{{ _('Back to dashboard') }}</a>
</div>
{% endblock %}
